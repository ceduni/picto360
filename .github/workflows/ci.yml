# Mirrors the checks in .husky/pre-commit so they also run on PRs and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (type-check, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # firebaseAuth.ts imports the gitignored service-account JSON; a stub is
      # enough for type-checking, and the tests don't initialize Firebase.
      - name: Stub Firebase service account
        run: echo '{"type":"service_account","project_id":"ci-stub"}' > picto-360-firebase-adminsdk-fbsvc-76d12c9ce7.json

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx jest

  picto-app:
    name: picto-app (type-check, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: picto-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: picto-app/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npx eslint . --ext ts,tsx
